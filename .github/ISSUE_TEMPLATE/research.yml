name: "🔬 Research / Spike"
description: "Timeboxed technical investigation, algorithmic benchmark, or architectural spike"
title: "[SPIKE]: "
labels: ["type:research", "status:specifying"]
body:
  - type: markdown
    attributes:
      value: |
        ### MetroLens AI™ — Technical Research & Spike Protocol
        Spikes are timeboxed architectural experiments designed to de-risk key technical questions. Every spike MUST produce a concrete decision, benchmark document, or architectural recommendation.
        *Authoritative References:* [`docs/IMPLEMENTATION_PLAN.md`](../../docs/IMPLEMENTATION_PLAN.md) | [`docs/DECISION_LOG.md`](../../docs/DECISION_LOG.md)

  - type: input
    id: research_question
    attributes:
      label: "Core Research Question / Hypothesis"
      description: "State the specific question or hypothesis being investigated."
      placeholder: "e.g., Can PaddleOCR v4 ONNX int8 achieve < 1,200ms latency and < 8% CER on demonstrator CPU?"
    validations:
      required: true

  - type: textarea
    id: context_and_background
    attributes:
      label: "Context & Architectural Motivation"
      description: "Why is this spike needed? What uncertainty or architectural risk does it resolve?"
      placeholder: "e.g., Running full PyTorch models causes high latency on consumer laptops. We need to evaluate whether int8 ONNX quantization maintains acceptable Devanagari character accuracy."
    validations:
      required: true

  - type: input
    id: architectural_anchor
    attributes:
      label: "Architectural / Benchmark Anchor"
      description: "Link to relevant section of Master Blueprint v0.3, Decision Log, or Traceability Matrix."
      placeholder: "e.g., Master Blueprint v0.3 Section 4.2; docs/IMPLEMENTATION_PLAN.md Experiment A; Traceability TR-02"
    validations:
      required: true

  - type: textarea
    id: current_understanding_and_hypotheses
    attributes:
      label: "Current Understanding & Hypotheses"
      description: "What do we know today, and what do we hypothesize will happen?"
      placeholder: |
        - Hypothesis 1: 4-thread ONNX Runtime with int8 weights reduces latency from ~2.8s to <1.1s.
        - Hypothesis 2: Quantization loss on high-contrast numeric characters (MRP/Net Qty) will be under 1.5%.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: "Alternatives Considered / In Competition"
      description: "What approaches are being compared?"
      placeholder: |
        - Option A: PaddleOCR v4 Mobile with ONNX int8 quantization (preferred candidate).
        - Option B: Tesseract 5.3 with LSTM Hindi/English models.
        - Option C: EasyOCR PyTorch FP16.
    validations:
      required: true

  - type: dropdown
    id: timebox
    attributes:
      label: "Strict Timebox Limit"
      description: "Spikes MUST be timeboxed to avoid open-ended research drag."
      options:
        - "4 Hours (Quick configuration / library comparison)"
        - "8 Hours (Focused benchmark / prototype script)"
        - "16 Hours (Multi-model evaluation on sample dataset)"
        - "24 Hours (Maximum Hackathon Validation Spike limit per plan)"
    validations:
      required: true

  - type: textarea
    id: concrete_deliverable
    attributes:
      label: "Expected Concrete Deliverable / Decision Outcome"
      description: "What tangible artifact will this spike produce? (Must not be just 'discussion')."
      placeholder: |
        - Benchmarked latency & CER table committed to docs/benchmarks/ocr_cpu_results.md.
        - New Decision Log entry in docs/DECISION_LOG.md (ADR-00X).
        - Standalone benchmark script in tools/benchmark_ocr_latency.py.
    validations:
      required: true

  - type: textarea
    id: success_failure_criteria
    attributes:
      label: "Quantitative Success / Failure Criteria (Hard Gates)"
      description: "What measurable results indicate a PASS (GO) vs FAIL (PIVOT / MODIFY)?"
      placeholder: |
        - GO: Latency < 1,200ms AND CER < 8% across 15 test SKU crops.
        - MODIFY: Latency 1,200ms–1,800ms -> add ROI preprocessing to reduce image area.
        - PIVOT: Latency > 1,800ms or CER > 15% -> fall back to serverless local cache.
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: "Primary Subsystem"
      description: "Subsystem domain for this investigation."
      options:
        - "AI & Scene Text OCR (modules/ocr/)"
        - "Computer Vision & Metric Scale (modules/cv/)"
        - "Backend & Rule Engine (modules/rules/)"
        - "Frontend & UX Architecture (frontend/)"
        - "Data Collection & Curation (data/)"
        - "Infrastructure & Performance (backend/)"
    validations:
      required: true

  - type: dropdown
    id: primary_owner
    attributes:
      label: "Primary Owner (Spike Lead)"
      description: "Single engineer executing the spike."
      options:
        - "M1 — AI & OCR Lead (PaddleOCR ONNX, CPU quantization, Devanagari)"
        - "M2 — Calibration & Geometry Lead (Optical scale, coin detection, cylinder invariance)"
        - "M3 — Backend & Rule Engine Lead (FastAPI, schemas, LMPC state machine, USP math)"
        - "M4 — Frontend & UX Lead (Vite/React PWA, viewfinder, 5-state badges, evidence viewer)"
        - "M5 — Data & Benchmark Lead (SKU curation, 1200 DPI ground-truth scans, CER/WER)"
        - "M6 — Product, DevOps & Presentation Lead (Governance, CI/CD, PDF reports, eMaap adapter)"
    validations:
      required: true

  - type: checkboxes
    id: dor_verification
    attributes:
      label: "Definition of Ready (DoR) Gate Checklist"
      description: "Verify readiness before beginning spike investigation."
      options:
        - label: "Research question / hypothesis stated with clarity"
          required: true
        - label: "Strict timebox limit explicitly agreed"
          required: true
        - label: "Concrete deliverable defined (Decision Log entry, script, or benchmark doc)"
          required: true
        - label: "Quantitative success/failure thresholds specified"
          required: true
        - label: "Exactly one primary owner assigned (M1–M6)"
          required: true
