[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak-reporting"
version = "0.1.0"
description = "Legal Metrology Inspection Dossier generation and ReportLab PDF renderer for Nirikshak."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nirikshak-shared",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
