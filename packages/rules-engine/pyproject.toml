[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak-rules-engine"
version = "0.1.0"
description = "Deterministic statutory legal metrology compliance evaluation engine for Nirikshak."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nirikshak-shared",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
