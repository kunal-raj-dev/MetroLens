[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak-ocr"
version = "0.1.0"
description = "Multilingual optical character recognition and text tokenization for Nirikshak."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nirikshak-shared",
    "numpy>=1.24.0",
    "onnxruntime>=1.18.0",
    "opencv-python>=4.8.0",
    "pyclipper>=1.3.0",
    "shapely>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
