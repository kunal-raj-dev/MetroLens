[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak-shared"
version = "0.1.0"
description = "Canonical shared data contracts, schemas, and domain models for the Nirikshak platform."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
