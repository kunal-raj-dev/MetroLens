# Local development. Run with a private .env containing METROLENS_API_KEY.
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      METROLENS_API_KEY: ${METROLENS_API_KEY:?Set METROLENS_API_KEY in .env}
      METROLENS_CORS_ORIGINS: ${METROLENS_CORS_ORIGINS:-http://localhost:3000}
      METROLENS_SPOOL_DIR: /app/tmp/metrolens
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
