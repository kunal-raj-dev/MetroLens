[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Set NEXT_PUBLIC_API_URL to your separately deployed HTTPS API before building
# to enable live inspection. Never put METROLENS_API_KEY in a NEXT_PUBLIC variable.
